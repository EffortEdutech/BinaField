name: Phase 1 Batch 2 — Domain and Blueprint Contract Gate
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema verifier
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Contract/schema/fixture verification
        run: python tools/batch2/verify_contracts.py
      - name: TypeScript compile proof
        run: npx --yes typescript@5.8.3 tsc -p tsconfig.batch2.json
      - name: Kotlin compile proof note
        run: echo 'Run scripts/contracts/compile-kotlin.sh on the pinned engineering image containing Kotlin 1.9+; local Batch 2 evidence includes a successful Kotlin 1.9 compile.'
      - name: Upload Batch 2 verification
        uses: actions/upload-artifact@v4
        with:
          name: binafield-phase1-batch02-contract-proof
          path: artefacts/phase1/test-results/batch02-contract-verification.json
